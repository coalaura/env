name: Build and Deploy Site

on:
  push:
    branches:
      - master
    paths:
      - "discord/theme.css"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install CSS Build Dependencies
        run: npm install postcss postcss-import-url cssnano

      - name: Build CSS
        run: |
          node -e '
          const fs = require("fs"),
              postcss = require("postcss"),
              postcssImportUrl = require("postcss-import-url"),
              cssnano = require("cssnano");

          const css = fs.readFileSync("discord/theme.css", "utf8");

          postcss([
                  postcssImportUrl({
                      filter: (url) => !url.includes("fonts.googleapis.com") && !url.includes("fonts.gstatic.com")
                  }),
                  cssnano()
              ])
              .process(css, {
                  from: "discord/theme.css"
              })
              .then(result => {
                  fs.mkdirSync("css", {
                      recursive: true
                  });
                  fs.writeFileSync("css/discord.min.css", result.css);
                  console.log("CSS successfully built.");
              })
              .catch(err => {
                  console.error(err);
                  process.exit(1);
              });
          '

      - name: Upload CSS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: css-theme
          path: css/discord.min.css

  deploy:
    needs: build-css
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download CSS Artifact
        uses: actions/download-artifact@v8
        with:
          name: css-theme
          path: dist/css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
